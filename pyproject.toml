[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "proposal-studio"
dynamic = ["version"]
description = "Fully local, offline proposal workbench: RFP analysis, deck writing and PPTX rendering."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
authors = [{ name = "Proposal Studio contributors" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
]
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "pymupdf>=1.24",
    "python-docx>=1.1",
    "openpyxl>=3.1",
    "python-pptx>=0.6.23",
    "faiss-cpu>=1.8",
    "numpy>=1.26",
    "typer>=0.12",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.6", "pre-commit>=3.7", "build>=1.2"]

[project.scripts]
studio = "studio.cli:app"

[tool.hatch.version]
path = "src/studio/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/studio"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["ignore:builtin type .* has no __module__ attribute:DeprecationWarning"]
