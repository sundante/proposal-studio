name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build sdist, wheel, Windows bundle and notes
        run: |
          python -m pip install --upgrade pip build
          python -m build --outdir dist
          python scripts/build_release.py --version "${GITHUB_REF_NAME}" --out dist
          ls -l dist
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  verify-windows:
    needs: build
    runs-on: windows-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: Install the bundle into a fresh folder with setup.ps1
        shell: pwsh
        env:
          STUDIO_SKIP_MODELS: "1" # no Ollama on the runner; everything else is a real install
        run: |
          $zip = Get-ChildItem dist/*-windows.zip | Select-Object -First 1
          $dest = Join-Path $env:RUNNER_TEMP 'bundle'
          Expand-Archive $zip.FullName -DestinationPath $dest
          $root = Get-ChildItem $dest -Directory | Select-Object -First 1
          Set-Location $root.FullName
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts\setup.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .venv\Scripts\studio.exe --version
          .venv\Scripts\studio.exe ui --help
          .venv\Scripts\python.exe -m pip install pytest pytest-asyncio
          .venv\Scripts\python.exe -m pytest -q

  release:
    needs: [build, verify-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "Proposal Studio ${GITHUB_REF_NAME}" \
            --notes-file dist/RELEASE_NOTES.md \
            dist/*.whl dist/*.tar.gz dist/*-windows.zip
