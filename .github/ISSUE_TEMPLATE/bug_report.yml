name: Bug report
description: Something doesn't work as documented
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        **Do not paste real RFPs, client documents, PHI or proprietary templates.** Reproduce with synthetic data.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: The command you ran, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: "1. /new acme-demo\n2. /ingest (synthetic file)\n3. ..."
  - type: textarea
    id: doctor
    attributes:
      label: Output of `studio doctor`
      render: text
  - type: input
    id: version
    attributes:
      label: Version (`studio --version`)
  - type: dropdown
    id: os
    attributes:
      label: OS
      options: [Windows 11, macOS, Linux]
  - type: checkboxes
    id: hygiene
    attributes:
      label: Data hygiene
      options:
        - label: This report contains no client, personal or proprietary data.
          required: true
