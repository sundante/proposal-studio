name: Feature request
description: Suggest an improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what gets in the way?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
  - type: checkboxes
    id: constraints
    attributes:
      label: Constraints
      options:
        - label: Works fully offline on a 16 GB CPU-only machine without admin rights.
        - label: Needs no new runtime dependency (or the dependency is justified above).
